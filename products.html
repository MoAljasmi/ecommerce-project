<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ShopNow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart</a>
      <a href="dashboard.html">Dashboard</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>
  <div style="margin:20px">
    <input type="text" id="smart-search" size="40" placeholder='Smart search - try: "mouse under 200"'>
    <div id="smart-results"></div>
  </div>
  <div style="margin:20px">
    <input type="text" id="search-box" placeholder="Search products...">
    <select id="sort-select">
      <option value="default">Sort by Price</option>
      <option value="low-high">Price: Low to High</option>
      <option value="high-low">Price: High to Low</option>
    </select>
  </div>
  <div id="product-list" class="product-grid"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/smart-search.js"></script>
</body>
</html>
